<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="nav-brand">
                <div class="brand-row">
                    <img *ngIf="usePlatformLogoImage && platformLogoUrl" [src]="platformLogoUrl" alt="Platform Logo"
                        class="sidebar-logo-img">
                    <span *ngIf="!usePlatformLogoImage || !platformLogoUrl" class="brand-text">
                        <span class="brand-accent">{{ platformName.substring(0, 2) }}</span><span class="brand-dark">{{ platformName.substring(2) }}</span>
                    </span>
                </div>
                <small class="app-version-tag">PRO Edition v{{ appVersion }}</small>
            </div>
            <p class="login-subtitle">Ingresa a tu panel de gestión empresarial e IA</p>
        </div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required
                    placeholder="admin@woox.app">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required
                    placeholder="••••••••">
            </div>

            <div class="error-msg" *ngIf="error">
                {{ error }}
            </div>

            <button type="submit" class="login-btn" [disabled]="isSubmitting || !loginForm.valid">
                {{ isSubmitting ? 'Ingresando...' : 'Iniciar Sesión' }}
            </button>
        </form>

        <div class="login-footer">
            <p>¿No tienes una cuenta aún? <a routerLink="/register" style="color: #4F46E5; font-weight: 700; text-decoration: none;">Crear cuenta gratis (14 días de prueba)</a></p>
            <p style="margin-top: 8px;">¿Olvidaste tu contraseña? Contacta a soporte.</p>
        </div>
    </div>
</div>
