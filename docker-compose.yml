services:
  woox:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - GOOGLE_API_KEY
      - AUTH_SECRET
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
# El servicio woox-ai-engine ha sido migrado a Supabase Edge Functions
# para optimizar recursos y simplificar la arquitectura.
