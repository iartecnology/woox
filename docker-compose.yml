services:
  woox:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - GOOGLE_API_KEY
      - AUTH_SECRET
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

# Easypanel gestionará la red interna automáticamente.
