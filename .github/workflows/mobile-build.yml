name: Build Mobile (Android APK)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'woox-mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Android APK Build (Expo)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'woox-mobile/package-lock.json'

      - name: 🔧 Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Instalar dependencias móviles
        working-directory: woox-mobile
        run: npm install

      - name: ⚙️ Expo Prebuild (Generar proyecto Android nativo)
        working-directory: woox-mobile
        run: npx expo prebuild --platform android --clean

      - name: 🏗️ Compilar APK (assembleDebug)
        working-directory: woox-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Subir APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: woox-merchant-apk
          path: woox-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
